<article class="card" [class.destacado]="destacado()">
  <div class="card__top">
    <span class="badge">{{ producto().categoria }}</span>
    @if (destacado()) {
      <span class="ribbon">Destacado</span>
    }
  </div>
  <h2>{{ producto().nombre }}</h2>
  <p>{{ producto().descripcion }}</p>
  <strong>{{ producto().precio | currency: 'PEN' : 'symbol' : '1.2-2' }}</strong>

  <div class="actions">
    <button type="button" (click)="solicitarDetalle()">Ver detalle</button>
    <button type="button" class="ghost" (click)="marcarFavorito()">Favorito</button>
    <button type="button" class="ghost" (click)="comparar()">Comparar</button>
  </div>
</article>
