spring.application.name=productos-api

# Semana 10: ningun secreto en Git. La contrasena de MySQL y la clave del JWT
# se leen de variables de entorno de la terminal que arranca la aplicacion.
# DB_PASSWORD vacio corresponde al root sin contrasena de XAMPP.
spring.datasource.url=jdbc:mysql://localhost:3306/productos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT firmado con HS256 (semana 9). Si falta JWT_SECRET_BASE64 la aplicacion
# no arranca: es preferible a firmar tokens con una clave conocida.
app.jwt.issuer=productos-api
app.jwt.ttl-minutes=30
app.jwt.secret-base64=${JWT_SECRET_BASE64}
