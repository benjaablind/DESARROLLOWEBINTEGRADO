# Configuracion usada solo por las pruebas.
# La aplicacion corre contra MySQL; @DataJpaTest usa una base embebida H2 para
# poder verificar el Repository sin depender del servidor MySQL.
spring.application.name=productos-api-test

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
