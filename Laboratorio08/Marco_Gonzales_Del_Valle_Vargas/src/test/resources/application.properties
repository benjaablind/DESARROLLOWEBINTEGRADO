# Configuracion usada solo por las pruebas.
# La aplicacion corre contra MySQL; las pruebas usan H2 en memoria para poder
# verificar consultas JPQL y el comportamiento transaccional sin depender del
# servidor MySQL.
spring.application.name=productos-api-test

spring.datasource.url=jdbc:h2:mem:productos_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
