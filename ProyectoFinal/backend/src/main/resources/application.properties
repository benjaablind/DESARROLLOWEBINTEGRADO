spring.application.name=odontologia-backend
server.port=8080

# Mensajes de error detallados durante el desarrollo.
server.error.include-message=always
server.error.include-binding-errors=always

# ---------------------------------------------------------------------------
# Base de datos (semanas 6 y 7)
# ---------------------------------------------------------------------------
# Crear la base una vez con backend/sql/01_crear_base_datos.sql.
# Las credenciales se leen de variables de entorno para no versionarlas:
#   DB_USERNAME (por defecto root) y DB_PASSWORD (por defecto vacia).
spring.datasource.url=jdbc:mysql://localhost:3306/odontologia_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# update: Hibernate crea y ajusta las tablas a partir de las entidades.
# Es adecuado para desarrollo; en produccion se usaria una herramienta de
# migraciones (Flyway o Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# La sesion de persistencia no se mantiene abierta durante la capa web: toda la
# carga de datos ocurre dentro de las transacciones de los servicios.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Seguridad con JWT (semanas 8 y 9)
# ---------------------------------------------------------------------------
# La clave HS256 NO se escribe aqui: se lee de la variable de entorno
# JWT_SECRET_BASE64 (32 bytes aleatorios en Base64). Sin ella la aplicacion no
# arranca. backend/iniciar.ps1 la genera para la sesion de terminal.
app.jwt.issuer=odontologia-api
app.jwt.ttl-minutes=60
app.jwt.secret-base64=${JWT_SECRET_BASE64}

# Limites para la subida de archivos clinicos (modulo del Integrante 6).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Carpeta local donde se guardan los archivos clinicos durante el desarrollo.
# En la base solo se guardan los metadatos; el binario queda en disco.
# En la etapa de despliegue esta ruta se reemplaza por almacenamiento en la nube.
app.archivos.directorio=uploads

# Origen permitido para el frontend Angular en desarrollo.
app.cors.origenes=http://localhost:4200
