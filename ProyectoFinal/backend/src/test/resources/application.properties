# Configuracion usada solo por las pruebas.
# La aplicacion corre contra MySQL; las pruebas usan H2 en memoria, en modo
# compatible con MySQL, para no depender de un servidor instalado.
spring.application.name=odontologia-backend-test

spring.datasource.url=jdbc:h2:mem:odontologia_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.error.include-message=always
server.error.include-binding-errors=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ArchivoControllerTest verifica los archivos en esta misma carpeta.
app.archivos.directorio=uploads
app.cors.origenes=http://localhost:4200

# Clave EXCLUSIVA de pruebas: es la cadena publica
# "clave-de-prueba-solo-para-tests!" (32 bytes) en Base64. No protege nada
# real; la aplicacion de verdad lee su clave de JWT_SECRET_BASE64.
app.jwt.issuer=odontologia-api
app.jwt.ttl-minutes=60
app.jwt.secret-base64=Y2xhdmUtZGUtcHJ1ZWJhLXNvbG8tcGFyYS10ZXN0cyE=
