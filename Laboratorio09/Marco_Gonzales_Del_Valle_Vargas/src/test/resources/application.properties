# Configuracion usada solo por las pruebas.
# La aplicacion corre contra MySQL; las pruebas usan H2 en memoria.
spring.application.name=productos-api-test

spring.datasource.url=jdbc:h2:mem:productos_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Clave EXCLUSIVA de pruebas: es la cadena publica
# "clave-de-prueba-solo-para-tests!" (32 bytes) en Base64.
# No protege nada real y no debe usarse fuera de src/test.
# La aplicacion de verdad la lee de la variable de entorno JWT_SECRET_BASE64.
app.jwt.issuer=productos-api
app.jwt.ttl-minutes=30
app.jwt.secret-base64=Y2xhdmUtZGUtcHJ1ZWJhLXNvbG8tcGFyYS10ZXN0cyE=
