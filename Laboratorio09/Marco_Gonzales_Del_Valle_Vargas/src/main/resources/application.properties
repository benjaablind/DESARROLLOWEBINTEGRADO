spring.application.name=productos-api

spring.datasource.url=jdbc:mysql://localhost:3306/productos_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=TU_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Semana 9: JWT firmado con HS256.
# La clave NO se escribe aqui: se lee de la variable de entorno JWT_SECRET_BASE64
# (32 bytes aleatorios en Base64). Si falta, la aplicacion no arranca.
app.jwt.issuer=productos-api
app.jwt.ttl-minutes=30
app.jwt.secret-base64=${JWT_SECRET_BASE64}

# Laboratorio local: la contrasena de MySQL va aqui por simplicidad.
# En un entorno real se usan variables de entorno o un gestor de secretos.
